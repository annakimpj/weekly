<meta name="apple-mobile-web-app-title" content="Weekly">
<meta name="application-name" content="Weekly">
<meta name="theme-color" content="#f5f1ea">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#222;--mute:#8a8a85;--line:#e4e2da;--acc:#3b6df0;--accbg:#e8eefe;--today:#fff6dd;--red:#d9503f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--ink:#eee;--mute:#8e8e96;--line:#34343a;--acc:#7b9bff;--accbg:#27304f;--today:#3a3320;--red:#f07a6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--ink:#eee;--mute:#8e8e96;--line:#34343a;--acc:#7b9bff;--accbg:#27304f;--today:#3a3320;--red:#f07a6a;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
header{display:flex;align-items:center;gap:6px;padding:8px 10px}
header h1{font-size:16px;margin:0;flex:1;font-weight:700}
header h1 small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.ib{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:16px}
.tb{padding:0 10px;height:34px;border-radius:17px;background:var(--card);border:1px solid var(--line);font-size:12px}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:6px;padding:0 8px 8px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 7px;overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative}
.cell.today{background:var(--today);border-color:var(--acc)}
.cell.re{outline:2px solid var(--acc)}
.dh{font-weight:700;font-size:12px;display:flex;justify-content:space-between;margin-bottom:3px;flex:none}
.dh span{color:var(--mute);font-weight:400}.sun .dh b{color:var(--red)}.sat .dh b{color:var(--acc)}
.list{flex:1;overflow-y:auto;min-height:0;scrollbar-width:none}.list::-webkit-scrollbar{display:none}
.it{display:flex;gap:4px;align-items:flex-start;padding:2px 0;font-size:12.5px;word-break:break-all}
.it i{flex:none;width:11px;height:11px;margin-top:2px;border:1.5px solid var(--mute);border-radius:3px}
.it.done{color:var(--mute);text-decoration:line-through}.it.done i{background:var(--mute)}
.it .t{flex:1}
.mv{flex:none;font-size:11px;padding:0 3px;color:var(--acc)}
.cal{padding:5px}.ct{font-weight:700;font-size:12px;text-align:center;margin-bottom:2px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);flex:1;min-height:0;font-size:10px;text-align:center;align-content:space-between}
.cg div{display:flex;align-items:center;justify-content:center;position:relative}
.cg .h{color:var(--mute)}.cg .o{color:var(--mute);opacity:.5}.cg .w{background:var(--accbg)}
.cg .td b{background:var(--acc);color:#fff;border-radius:50%;width:16px;height:16px;line-height:16px;font-weight:600}
.cg .dot::after{content:"";position:absolute;bottom:0;width:3px;height:3px;border-radius:50%;background:var(--acc)}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:5}
.fab button{width:48px;height:48px;border-radius:50%;box-shadow:0 3px 10px #0004;font-size:22px;background:var(--card);border:1px solid var(--line)}
.fab .p{background:var(--acc);color:#fff;border:0;font-size:28px}
.ov{position:fixed;inset:0;background:#0006;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));-webkit-user-select:text;user-select:text}
.sh h2{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.sh input[type=text],.sh input[type=date]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;font:inherit;margin-bottom:8px}
.chips{display:flex;gap:5px;margin:4px 0 10px}.chips label{flex:1;text-align:center}
.chips span{display:block;padding:7px 0;border:1px solid var(--line);border-radius:8px;font-size:13px}
.chips input{display:none}.chips input:checked+span{background:var(--acc);color:#fff;border-color:var(--acc)}
.pb{background:var(--acc);color:#fff;border-radius:10px;padding:11px;width:100%;font-weight:600}
.sb{border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;margin-top:8px;text-align:left}
.row{display:flex;align-items:center;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1;word-break:break-all}.row.done .t{text-decoration:line-through;color:var(--mute)}
.row button{padding:4px 7px;border:1px solid var(--line);border-radius:7px;font-size:12px}
.mute{color:var(--mute);font-size:12px}.res{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}

/* 공휴일 자동 업데이트: Google 공개 "대한민국의 휴일" 캘린더(로그인 불필요, 하루 한 번). 설명이 "공휴일"인 날만, 기념일은 제외. 실패하면 HOL 표 사용 */
function holSync(){let c=null;try{c=JSON.parse(localStorage.getItem("wp_hol")||"null")}catch(e){}if(c&&Date.now()-c.at<864e5)return;
const y=new Date().getFullYear(),ys=[y-1,y,y+1,y+2,y+3].map(String),id=encodeURIComponent("ko.south_korea#holiday@group.v.calendar.google.com");
fetch("https://www.googleapis.com/calendar/v3/calendars/"+id+"/events?key="+FB_CONFIG.apiKey+"&singleEvents=true&maxResults=500&timeMin="+ys[0]+"-01-01T00:00:00Z&timeMax="+(y+4)+"-01-01T00:00:00Z&fields="+encodeURIComponent("items(description,start,end)")).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{const d=[];
(j.items||[]).forEach(e=>{if(!e.start||!e.start.date||!/^공휴일/.test(e.description||""))return;for(let x=P(e.start.date),z=P(e.end.date);x<z;x=addD(x,1))d.push(K(x))});
const got=ys.filter(v=>d.some(k=>k.startsWith(v)));if(!got.length)return;HX=new Set(d);HY=new Set(got);try{localStorage.setItem("wp_hol",JSON.stringify({at:Date.now(),d,y:got}))}catch(e){}render()}).catch(()=>{})}
holSync();
